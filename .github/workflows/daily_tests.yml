name: Generate Daily English Tests

on:
  workflow_dispatch:
  schedule:
    # 5:00 AM IST is 23:30 PM UTC previous day (gives 2hr queue buffer to guarantee availability by 7:00 AM IST)
    - cron: '30 23 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Daily English Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INCREMENT_DAY: "true"
        run: |
          python scripts/generate_daily_tests.py --increment

      - name: Commit and Push Generated Tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html tests/ scripts/
          if git diff --staged --quiet; then
            echo "No new daily tests to commit."
          else
            git commit -m "Auto-generate daily English tests"
            git push origin main
          fi
